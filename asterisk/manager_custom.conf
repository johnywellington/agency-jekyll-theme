; ── Call Center Dialer ───────────────────────────────────────────────
; Acrescentar a /etc/asterisk/manager_custom.conf  (o install.sh faz isto)
; Só aceita ligações locais. Trocar o secret.
[callcenter]
secret = TROCAR-SEGREDO-AMI
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = call,system,reporting
write = call,originate,system,reporting
writetimeout = 5000
; ── fim Call Center Dialer ───────────────────────────────────────────
