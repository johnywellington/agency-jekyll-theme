; ── Call Center Dialer ───────────────────────────────────────────────
; Acrescentar a /etc/asterisk/extensions_custom.conf  (o install.sh faz isto)
; Quando o cliente atende, a chamada entra aqui: põe o número/nome do cliente
; no ecrã do agente e segue para o ramal / fila / ring group da campanha.
[callcenter-dialer]
exten => s,1,NoOp(CallCenter: campanha ${CC_CAMP} cliente ${CC_NUM} -> ${CC_DEST})
 same => n,Set(CALLERID(num)=${CC_NUM})
 same => n,Set(CALLERID(name)=${IF($["${CC_NOME}" = ""]?${CC_NUM}:${CC_NOME})})
 same => n,Set(__CC_CAMP=${CC_CAMP})
 same => n,Goto(from-internal,${CC_DEST},1)
 same => n,Hangup()
; ── fim Call Center Dialer ───────────────────────────────────────────
